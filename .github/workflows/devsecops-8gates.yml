name: DevSecOps-8Gates

on:
  push:
    branches:
      - main

jobs:

  gate11-sast:
    name: Gate 1.1 - SAST
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5

      - run: |
          pip install semgrep

      - run: |
          semgrep scan . --error

  gate12-dependency:
    name: Gate 1.2 - Dependency Scan
    needs: gate11-sast
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: |
          npm install -g snyk

      - run: |
          snyk auth ${{ secrets.SNYK_TOKEN }}

      - run: |
          snyk test --severity-threshold=medium

  gate13-secret:
    name: Gate 1.3 - Secret Scan
    needs: gate12-dependency
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: |
          docker run --rm \
          -v $PWD:/repo \
          zricethezav/gitleaks:latest detect \
          --source=/repo

  gate14-iac:
    name: Gate 1.4 - IaC Scan
    needs: gate13-secret
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: |
          docker run --rm \
          -v $PWD:/tf \
          bridgecrew/checkov \
          -d /tf

  gate21-container:
    name: Gate 2.1 - Container Scan
    needs: gate14-iac
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: |
          docker build -t vulnerable-app .

      - run: |
          docker run \
          --rm \
          aquasec/trivy image \
          --exit-code 1 \
          --severity HIGH,CRITICAL \
          vulnerable-app

  gate22-signing:
    name: Gate 2.2 - Artifact Signing
    needs: gate21-container
    runs-on: ubuntu-latest

    steps:
      - run: |
          curl -O -L \
          https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64

          chmod +x cosign-linux-amd64

          sudo mv cosign-linux-amd64 /usr/local/bin/cosign

      - run: |
          cosign verify vulnerable-app

  gate31-dast:
    name: Gate 3.1 - DAST
    needs: gate22-signing
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - run: |
          docker build -t vulnerable-app .

      - run: |
          docker run -d \
          --name vuln \
          -p 5000:5000 \
          vulnerable-app

      - run: |
          docker run --rm \
          --network host \
          ghcr.io/zaproxy/zaproxy:stable \
          zap-baseline.py \
          -t http://localhost:5000 \
          -m 5

  gate32-kubernetes:
    name: Gate 3.2 - Kubernetes Scan
    needs: gate31-dast
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: |
          curl -s \
          https://raw.githubusercontent.com/kubescape/kubescape/master/install.sh \
          | /bin/bash

      - run: |
          kubescape scan framework nsa \
          deployment.yaml
