name: Vulnerable App Test

on:
  push:
    paths:
      - 'vulnerable-app/**'

jobs:
  security-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: vulnerable-app

    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: pip install -r requirements.txt

      - name: SAST
        run: echo "Run SonarQube"

      - name: Secret Scan
        run: echo "Run Gitleaks"
