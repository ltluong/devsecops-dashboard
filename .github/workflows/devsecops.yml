name: DevSecOps Pipeline

on:
push:
branches:
- main

pull_request:
branches:
- main

jobs:

quality-gate:

```
runs-on: ubuntu-latest

steps:

  - name: Checkout Source
    uses: actions/checkout@v4

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: 17

  - name: Cache Maven Packages
    uses: actions/cache@v4
    with:
      path: ~/.m2
      key: maven-${{ hashFiles('**/pom.xml') }}

  ##################################
  # BUILD
  ##################################

  - name: Build
    run: mvn clean compile

  ##################################
  # UNIT TEST
  ##################################

  - name: Run Unit Tests
    run: mvn test

  ##################################
  # COVERAGE
  ##################################

  - name: Generate Coverage Report
    run: mvn verify

  ##################################
  # SONARQUBE ANALYSIS
  ##################################

  - name: SonarQube Scan
    run: |
      mvn sonar:sonar \
      -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
      -Dsonar.token=${{ secrets.SONAR_TOKEN }}

  ##################################
  # QUALITY GATE
  ##################################

  - name: SonarQube Quality Gate
    uses: SonarSource/sonarqube-quality-gate-action@master
    timeout-minutes: 5
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
```

docker:

```
needs: quality-gate

runs-on: ubuntu-latest

steps:

  - uses: actions/checkout@v4

  - name: Login Docker Hub
    uses: docker/login-action@v3
    with:
      username: ${{ secrets.DOCKER_USERNAME }}
      password: ${{ secrets.DOCKER_PASSWORD }}

  - name: Build Docker Image
    run: |
      docker build -t ${{ secrets.DOCKER_USERNAME }}/devsecops-app:latest .

  - name: Push Docker Image
    run: |
      docker push ${{ secrets.DOCKER_USERNAME }}/devsecops-app:latest
```

deploy:

```
needs: docker

runs-on: ubuntu-latest

steps:

  - name: Deploy to Ubuntu Server
    uses: appleboy/ssh-action@master
    with:
      host: ${{ secrets.SERVER_HOST }}
      username: ${{ secrets.SERVER_USER }}
      key: ${{ secrets.SERVER_SSH_KEY }}
      script: |
        docker pull ${{ secrets.DOCKER_USERNAME }}/devsecops-app:latest

        docker stop app || true
        docker rm app || true

        docker run -d \
          --name app \
          -p 80:8080 \
          ${{ secrets.DOCKER_USERNAME }}/devsecops-app:latest
```
