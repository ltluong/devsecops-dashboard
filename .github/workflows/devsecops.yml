name: DevSecOps Pipeline

on:
push:
branches:
- main

pull_request:
branches:
- main

jobs:

quality-gate:

```
runs-on: ubuntu-latest

steps:

  - name: Checkout Source
    uses: actions/checkout@v4

  - name: Setup Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: 17
      cache: maven

  - name: Build
    run: mvn clean compile

  - name: Unit Test
    run: mvn test

  - name: Coverage
    run: mvn verify

  - name: SonarQube Scan
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    run: |
      mvn sonar:sonar \
      -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
      -Dsonar.token=${SONAR_TOKEN}

  - name: Check Quality Gate
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    run: |
      echo "Waiting for SonarQube analysis..."

      sleep 30

      STATUS=$(curl -s -u ${SONAR_TOKEN}: \
      "${{ secrets.SONAR_HOST_URL }}/api/qualitygates/project_status?projectKey=${{ github.event.repository.name }}" \
      | jq -r '.projectStatus.status')

      echo "Quality Gate Status: $STATUS"

      if [ "$STATUS" != "OK" ]; then
        echo "QUALITY GATE FAILED"
        exit 1
      fi

      echo "QUALITY GATE PASSED"
```

docker:

```
needs: quality-gate

runs-on: ubuntu-latest

steps:

  - uses: actions/checkout@v4

  - name: Login DockerHub
    uses: docker/login-action@v3
    with:
      username: ${{ secrets.DOCKER_USERNAME }}
      password: ${{ secrets.DOCKER_PASSWORD }}

  - name: Build Docker Image
    run: |
      docker build \
      -t ${{ secrets.DOCKER_USERNAME }}/devsecops-app:latest .

  - name: Push Docker Image
    run: |
      docker push \
      ${{ secrets.DOCKER_USERNAME }}/devsecops-app:latest
```

deploy:

```
needs: docker

runs-on: ubuntu-latest

steps:

  - name: Deploy Ubuntu Server
    uses: appleboy/ssh-action@v1.2.0
    with:
      host: ${{ secrets.SERVER_HOST }}
      username: ${{ secrets.SERVER_USER }}
      key: ${{ secrets.SERVER_SSH_KEY }}
      script: |
        docker pull ${{ secrets.DOCKER_USERNAME }}/devsecops-app:latest

        docker stop app || true
        docker rm app || true

        docker run -d \
          --name app \
          -p 80:8080 \
          ${{ secrets.DOCKER_USERNAME }}/devsecops-app:latest
```
