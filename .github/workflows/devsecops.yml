name: DevSecOps Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
jobs:

jobs:

  sast:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Install Semgrep
        run: |
          python3 -m pip install semgrep

      - name: Run SAST
        run: |
          semgrep scan \
          --config auto \
          --sarif \
          --output sast-report.sarif \
          .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: sast-report.sarif
jobs:

  quality-gates:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      ##################################################
      # GATE 1.4 - BUILD / TEST GATE
      ##################################################

      - name: Run Unit Tests
        run: npm test -- --coverage

      ##################################################
      # GATE 1.2 - SAST GATE
      ##################################################

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/security-audit

      ##################################################
      # GATE 1.3 - SCA GATE
      ##################################################

      - name: Run Trivy Dependency Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1

      ##################################################
      # GATE 1.1 - SONARQUBE
      ##################################################

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker-build:

    needs: quality-gates

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/devsecops-dashboard:latest .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/devsecops-dashboard:latest

  deploy:

    needs: docker-build

    runs-on: ubuntu-latest

    steps:

      - name: Deploy To Ubuntu Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/devsecops-dashboard:latest

            docker stop devsecops-dashboard || true
            docker rm devsecops-dashboard || true

            docker run -d \
              --name devsecops-dashboard \
              -p 80:80 \
              ${{ secrets.DOCKER_USERNAME }}/devsecops-dashboard:latest
