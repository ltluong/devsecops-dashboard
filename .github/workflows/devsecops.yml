name: DevSecOps Pipeline

on:
push:
branches: [main]

pull_request:
branches: [main]

jobs:

gate1:

```
runs-on: ubuntu-latest

defaults:
  run:
    working-directory: frontend

steps:

  - name: Checkout Source
    uses: actions/checkout@v4

  - name: Debug Structure
    run: |
      pwd
      ls -la
      find .. -name package.json

  ####################################################
  # Gate 1.4 - Install Dependencies
  ####################################################

  - name: Setup NodeJS
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Install Dependencies
    run: npm install

  ####################################################
  # Gate 1.1 - SonarQube Quality Gate
  ####################################################

  - name: SonarQube Scan
    uses: SonarSource/sonarqube-scan-action@v5
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  - name: SonarQube Quality Gate
    uses: SonarSource/sonarqube-quality-gate-action@master
    timeout-minutes: 10
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  ####################################################
  # Gate 1.2 - Semgrep SAST
  ####################################################

  - name: Install Semgrep
    run: |
      python3 -m pip install --user semgrep
      echo "$HOME/.local/bin" >> $GITHUB_PATH

  - name: Run Semgrep
    run: |
      ~/.local/bin/semgrep scan \
      --config auto \
      --sarif \
      --output sast-report.sarif \
      .

  - name: SAST Quality Gate
    run: |
      sudo apt-get update
      sudo apt-get install jq -y

      ERRORS=$(jq '[.runs[].results[] |
      select(.level=="error")] | length' \
      sast-report.sarif)

      echo "Critical Findings: $ERRORS"

      if [ "$ERRORS" -gt 0 ]; then
        echo "Gate 1.2 FAILED"
        exit 1
      fi

      echo "Gate 1.2 PASSED"

  - name: Upload SAST Report
    uses: actions/upload-artifact@v4
    with:
      name: sast-report
      path: frontend/sast-report.sarif

  ####################################################
  # Gate 1.3 - SCA Dependency Scan
  ####################################################

  - name: Install Trivy
    uses: aquasecurity/setup-trivy@v0.2.2

  - name: Generate SBOM
    run: |
      trivy fs \
      --format cyclonedx \
      --output sbom.json \
      .

  - name: Run Trivy SCA
    run: |
      trivy fs \
      --severity HIGH,CRITICAL \
      --format json \
      --output trivy-results.json \
      .

  - name: Gate 1.3 Decision
    run: |
      HIGH=$(jq '
      [.Results[]?.Vulnerabilities[]? |
      select(.Severity=="HIGH" or .Severity=="CRITICAL")]
      | length' trivy-results.json)

      echo "High/Critical CVEs: $HIGH"

      if [ "$HIGH" -gt 0 ]; then
        echo "Gate 1.3 FAILED"
        exit 1
      fi

      echo "Gate 1.3 PASSED"

  - name: Upload SBOM
    uses: actions/upload-artifact@v4
    with:
      name: sbom
      path: frontend/sbom.json

  - name: Upload Trivy Report
    uses: actions/upload-artifact@v4
    with:
      name: trivy-report
      path: frontend/trivy-results.json

  ####################################################
  # Gate 1.4 - Unit Test + Coverage
  ####################################################

  - name: Run Unit Test
    run: npm test -- --coverage --watchAll=false

  - name: Build Application
    run: npm run build
```

