name: OWASP ZAP Scan

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  zap_scan:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'https://your-site-url.com'
