name: DevSecOps Quality Gates

on:
push:
branches:
- main

pull_request:
branches:
- main

jobs:

# =========================

# GATE 1.1 SONARQUBE

# =========================

gate-1-1-sonarqube:
runs-on: ubuntu-latest

```
steps:
  - uses: actions/checkout@v4

  - name: SonarQube Scan
    uses: SonarSource/sonarqube-scan-action@master
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
```

# =========================

# GATE 1.2 SEMGREP

# =========================

gate-1-2-semgrep:
runs-on: ubuntu-latest
needs: gate-1-1-sonarqube

```
steps:
  - uses: actions/checkout@v4

  - name: Install Semgrep
    run: pip install semgrep

  - name: Semgrep Scan
    run: |
      semgrep scan \
      --config auto \
      --error
```

# =========================

# GATE 1.3 TRIVY FS

# =========================

gate-1-3-trivyfs:
runs-on: ubuntu-latest
needs: gate-1-2-semgrep

```
steps:
  - uses: actions/checkout@v4

  - name: Trivy Filesystem Scan
    uses: aquasecurity/trivy-action@master
    with:
      scan-type: fs
      scan-ref: .
      severity: HIGH,CRITICAL
      exit-code: 1
```

# =========================

# GATE 1.4 COVERAGE

# =========================

gate-1-4-coverage:
runs-on: ubuntu-latest
needs: gate-1-3-trivyfs

```
defaults:
  run:
    working-directory: frontend

steps:
  - uses: actions/checkout@v4

  - uses: actions/setup-node@v4
    with:
      node-version: 22

  - run: npm install

  - run: npm run coverage
```

# =========================

# GATE 2.1 TRIVY IMAGE

# =========================

gate-2-1-trivy-image:
runs-on: ubuntu-latest
needs: gate-1-4-coverage

```
defaults:
  run:
    working-directory: frontend

steps:
  - uses: actions/checkout@v4

  - name: Build Docker Image
    run: |
      docker build \
      -t devsecops-frontend:latest .

  - name: Trivy Image Scan
    uses: aquasecurity/trivy-action@master
    with:
      image-ref: devsecops-frontend:latest
      severity: HIGH,CRITICAL
      exit-code: 1
```

# =========================

# GATE 2.2 CHECKOV

# =========================

gate-2-2-checkov:
runs-on: ubuntu-latest
needs: gate-2-1-trivy-image

```
steps:
  - uses: actions/checkout@v4

  - name: Install Checkov
    run: pip install checkov

  - name: Checkov Scan
    run: |
      checkov -d . \
      --framework dockerfile \
      --soft-fail false
```

# =========================

# DEPLOY STAGING

# =========================

deploy-staging:
runs-on: ubuntu-latest
needs: gate-2-2-checkov

```
steps:
  - run: |
      echo "Deploying to staging"
```

# =========================

# GATE 3.1 OWASP ZAP

# =========================

gate-3-1-zap:
runs-on: ubuntu-latest
needs: deploy-staging

```
steps:
  - uses: actions/checkout@v4

  - name: OWASP ZAP Baseline Scan
    uses: zaproxy/action-baseline@v0.12.0
    with:
      target: ${{ secrets.STAGING_URL }}
```

# =========================

# GATE 3.2 RELEASE DECISION

# =========================

gate-3-2-release:
runs-on: ubuntu-latest
needs:
- gate-1-1-sonarqube
- gate-1-2-semgrep
- gate-1-3-trivyfs
- gate-1-4-coverage
- gate-2-1-trivy-image
- gate-2-2-checkov
- gate-3-1-zap

```
steps:
  - name: Final Release Decision
    run: |
      echo "================================"
      echo "ALL SECURITY GATES PASSED"
      echo "================================"
      echo "GO TO PRODUCTION"
```

# =========================

# PRODUCTION

# =========================

deploy-production:
runs-on: ubuntu-latest
needs: gate-3-2-release

```
steps:
  - run: |
      echo "Deploying Production"
```
